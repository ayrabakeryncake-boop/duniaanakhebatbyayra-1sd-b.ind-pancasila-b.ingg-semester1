const LEVELS=["mudah","sedang","menantang"];
const chapterBanks=new Map(),examBanks=new Map();
const esc=value=>String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=items=>{const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const subjectById=id=>SUBJECTS.find(s=>s.id===id);

function makeBanks(){
  for(const subject of SUBJECTS){
    const exam=[];
    subject.chapters.forEach((chapter,ci)=>{
      const facts=chapter[3].map(line=>{
        const [prompt,answer,explanation,example,emoji]=line.split("~");
        return {prompt,answer,explanation,example,emoji};
      });
      const pool=[...new Set(facts.map(f=>f.answer))];
      const bank=[];
      facts.forEach((f,fi)=>{
        const distractors=shuffle(pool.filter(answer=>answer!==f.answer)).slice(0,3);
        for(let variant=0;variant<3;variant++){
          const prompt=[
            f.prompt,
            `Perhatikan ${f.emoji} lalu jawab: ${f.prompt}`,
            `Bayangkan kejadian sehari-hari. ${f.prompt}`
          ][variant];
          bank.push({
            id:`${subject.id}-b${ci+1}-f${fi+1}-v${variant+1}`,
            subject:subject.id,chapter:ci,difficulty:LEVELS[variant],
            type:variant===1?"petunjuk gambar/emoji":variant===2?"situasi singkat":"pilihan ganda",
            prompt,answer:f.answer,options:[f.answer,...distractors],
            explanation:f.explanation,example:f.example,emoji:f.emoji,
            hint:subject.id==="english"?"Baca petunjuk Indonesia. Pilih satu jawaban Inggris.":"Baca perlahan, lalu pilih satu jawaban."
          });
        }
        // Soal ujian memakai ID sendiri, tetapi fakta dan kuncinya tetap teruji.
        const difficulty=fi===0||fi===1||fi===7?"mudah":fi<=4?"sedang":"menantang";
        exam.push({
          id:`${subject.id}-ujian-b${ci+1}-f${fi+1}`,
          subject:subject.id,chapter:ci,difficulty,type:"pilihan ganda",
          prompt:f.prompt,answer:f.answer,options:[f.answer,...distractors],
          explanation:f.explanation,example:f.example,emoji:f.emoji,
          hint:subject.id==="english"?"Baca petunjuk Indonesia. Pilih satu jawaban Inggris.":"Baca perlahan, lalu pilih satu jawaban."
        });
      });
      chapterBanks.set(`${subject.id}:${ci}`,bank);
    });
    examBanks.set(subject.id,exam);
  }
}
makeBanks();

function validateBank(){
  const problems=[],ids=new Set();
  for(const [key,bank] of [...chapterBanks,...examBanks]){
    const needed=key.includes(":")?{mudah:7,sedang:8,menantang:5}:{mudah:10,sedang:12,menantang:8};
    for(const [level,count] of Object.entries(needed)){
      if(bank.filter(q=>q.difficulty===level).length<count)problems.push(`${key}: soal ${level} kurang`);
    }
    for(const q of bank){
      if(ids.has(q.id))problems.push(`ID ganda: ${q.id}`);
      ids.add(q.id);
      if(!q.prompt||!q.answer||!q.explanation||!q.example||!q.emoji||!q.hint||!LEVELS.includes(q.difficulty))problems.push(`Data tidak lengkap: ${q.id}`);
      if(q.options.length!==4||new Set(q.options).size!==4||q.options.filter(x=>x===q.answer).length!==1)problems.push(`Pilihan tidak sah: ${q.id}`);
    }
  }
  return {total:ids.size,problems};
}
const validation=validateBank();

      ${button("PILIH BAB","subject","secondary",`data-subject="${id}"`)}
    </div></section>`);
}
function takeQuestions(bank,counts){
  if(!bank)throw Error("Bank soal tidak tersedia.");
  const chosen=[];
  for(const level of LEVELS)chosen.push(...shuffle(bank.filter(q=>q.difficulty===level)).slice(0,counts[level]));
  if(chosen.length!==Object.values(counts).reduce((a,b)=>a+b,0)||new Set(chosen.map(q=>q.id)).size!==chosen.length){
    throw Error("Bank soal belum cukup untuk sesi ini.");
  }
  return chosen;
}
function startGame(id,chapter,exam=false){
  try{
    if(!subjectById(id))throw Error("Mata pelajaran tidak ditemukan.");
    const bank=exam?examBanks.get(id):chapterBanks.get(`${id}:${chapter}`);
    const questions=takeQuestions(bank,exam?{mudah:10,sedang:12,menantang:8}:{mudah:7,sedang:8,menantang:5});
    session={subject:id,chapter,exam,mode:"main",questions,index:0,wrong:[],answers:new Map()};
    mainResult=null;feedback=null;showQuestion();
  }catch(error){
    frame("Ada kendala",`<section class="card"><h1 class="font-black mb-3">Soal belum dapat dibuka</h1><p class="mb-4">${esc(error.message)}</p>${button("BERANDA","home","secondary")}</section>`);
  }
}
function context(){
  const s=subjectById(session.subject);
  return session.exam?"Latihan Ujian Semester 1":s.chapters[session.chapter][0];
}
function showQuestion(){
  if(!session)return home();
  const s=subjectById(session.subject),q=session.questions[session.index],total=session.questions.length;
  view={page:"question",subject:session.subject,chapter:session.chapter};
  session.currentOptions=shuffle(q.options);feedback=null;
  frame(`${s.name} › ${context()}`,`<section class="card question-card subject-${s.id} max-w-3xl mx-auto">
    <div class="flex flex-wrap justify-between gap-2 font-bold mb-3">
      <span>${session.mode==="retry"?"Ulang soal salah":"Soal"} ${session.index+1} dari ${total}</span>
      <span class="capitalize">${esc(q.difficulty)}</span>
    </div>
    <div class="meter mb-6" role="progressbar" aria-label="Kemajuan soal" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${session.index}">
      <div style="width:${Math.round(session.index/total*100)}%"></div>
    </div>
    <div class="text-5xl mb-3" aria-hidden="true">${esc(q.emoji)}</div>
    <p class="eyebrow mb-2">${esc(q.type)}</p>
    <h1 class="question-text font-black mb-3">${esc(q.prompt)}</h1>
    <p class="question-hint mb-6 text-slate-700">${esc(q.hint)}</p>
    <div id="answer-options" class="grid2 mb-5">
      ${session.currentOptions.map((option,i)=>`<button type="button" class="option" data-action="answer" data-choice="${i}" aria-label="Pilihan ${i+1}: ${esc(option)}">${esc(option)}</button>`).join("")}
    </div>
    <div id="feedback-box" aria-live="polite"></div>
    <div class="flex flex-wrap gap-3 mt-6">
      ${button("KEMBALI","back-from-game","secondary")}
      ${button("BERANDA","home","secondary")}
    </div>
  </section>`);
}
function answer(choice){
  if(!session||feedback!==null||!Number.isInteger(choice))return;
  const q=session.questions[session.index],picked=session.currentOptions[choice];
  if(picked===undefined)return;
  const correct=picked===q.answer;
  feedback={correct,picked};
  session.answers.set(q.id,picked);
  if(!correct)session.wrong.push(q);
  document.querySelectorAll("#answer-options button").forEach((b,i)=>{
    b.disabled=true;
    if(session.currentOptions[i]===q.answer)b.classList.add("correct");
    else if(i===choice)b.classList.add("incorrect");
  });
  document.getElementById("feedback-box").innerHTML=`<div class="feedback ${correct?"good":"try"}">
    <h2 class="font-black mb-2">${correct?"⭐ Hebat! Jawabanmu benar!":"Belum tepat. Yuk, belajar bersama!"}</h2>
    ${correct?"":`<p class="mb-2"><strong>Jawaban yang benar:</strong> ${esc(q.answer)}</p>`}
    <p class="mb-2">${esc(q.explanation)}</p>
    <p class="mb-4"><strong>Contoh:</strong> ${esc(q.example)}</p>
    ${button("LANJUT","next","primary")}
  </div>`;
}
function nextQuestion(){
  if(!session||feedback===null)return;
  session.index++;
  if(session.index>=session.questions.length)showResult();else showQuestion();
}
function scoreMessage(score){
  if(score>=90)return"Hebat sekali! Terus bermain dan belajar, ya!";
  if(score>=70)return"Bagus! Ayo pelajari lagi soal yang belum tepat.";
  return"Tidak apa-apa. Belajar pelan-pelan, kamu pasti bisa!";
}
function showResult(){
  if(!session)return home();
  if(session.mode==="main"){
    const correct=session.questions.length-session.wrong.length;
    mainResult={
      subject:session.subject,chapter:session.chapter,exam:session.exam,
      questions:[...session.questions],wrong:[...session.wrong],correct,
      score:Math.round(correct/session.questions.length*100)
    };
  }
  const r=mainResult;if(!r)return home();
  const s=subjectById(r.subject),isRetry=session.mode==="retry";
  const retryCorrect=isRetry?session.questions.length-session.wrong.length:0;
  view={page:"result",subject:r.subject,chapter:r.chapter};
  frame(`${s.name} › ${r.exam?"Ujian":s.chapters[r.chapter][0]} › Hasil`,`<section class="card max-w-3xl mx-auto">
    <div class="text-5xl mb-3" aria-hidden="true">🌟 🎉 🌟</div>
    <h1 class="font-black mb-2">${isRetry?"Latihan ulang selesai!":"Permainan selesai!"}</h1>
    <p class="mb-4">${esc(s.name)} · ${esc(r.exam?"Latihan Ujian Semester 1":s.chapters[r.chapter][0])}</p>
    ${isRetry?`<p class="mb-4">Dalam latihan ulang, kamu benar ${retryCorrect} dari ${session.questions.length} soal. Hasil permainan utama tetap ditampilkan di bawah.</p>`:""}
    <div class="grid3 mb-5">
      ${[["Benar",`${r.correct} dari ${r.questions.length}`],["Salah",String(r.wrong.length)],["Skor sesi",`${r.score} dari 100`]].map(([label,value],i)=>`<div class="rounded-2xl p-4" style="background:${["#dcf3ff","#ffe2ed","#fff0b5"][i]}"><div class="small">${label}</div><div class="font-black">${value}</div></div>`).join("")}
    </div>
    <p class="font-bold mb-5">${esc(scoreMessage(r.score))}</p>
    <h2 class="font-black mb-2">Soal yang perlu dipelajari kembali</h2>
    ${r.wrong.length?`<ol class="list-decimal pl-6 mb-6 space-y-3">${r.wrong.map(q=>`<li>${esc(q.prompt)} <span class="text-slate-700">— ${esc(q.answer)}. ${esc(q.explanation)}</span></li>`).join("")}</ol>`:'<p class="mb-6">Luar biasa! Semua jawabanmu benar!</p>'}
    <div class="grid gap-3">
      ${r.wrong.length?button("ULANGI SOAL YANG SALAH","retry","mint"):""}
      ${button(r.exam?"ULANGI UJIAN DENGAN SOAL BARU":"MAIN LAGI DENGAN SOAL BARU","new-game","primary")}
      ${button("KEMBALI KE DAFTAR BAB","subject","secondary",`data-subject="${r.subject}"`)}
    </div>
  </section>`);
}
function retryWrong(){
  if(!mainResult||!mainResult.wrong.length)return;
  session={
    subject:mainResult.subject,chapter:mainResult.chapter,exam:mainResult.exam,
    mode:"retry",questions:shuffle(mainResult.wrong),index:0,answers:new Map(),wrong:[]
  };
  showQuestion();
}
function backFromGame(){
  if(!session)return home();
  if(session.mode==="retry"){showResult();return}
  if(session.exam)showExamIntro(session.subject);else showChapter(session.subject,session.chapter);
}
function runtimeChecks(){
  const checks=[];
  checks.push(["Tiga mata pelajaran dan 18 bab tersedia",SUBJECTS.length===3&&SUBJECTS.every(s=>s.chapters.length===6)]);
  let chapters=true,exams=true,shuffleKeys=true;
  for(const s of SUBJECTS){
    for(let i=0;i<6;i++){
      try{
        const selected=takeQuestions(chapterBanks.get(`${s.id}:${i}`),{mudah:7,sedang:8,menantang:5});
        chapters&&=selected.length===20&&selected.slice(0,7).every(q=>q.difficulty==="mudah")&&selected.slice(7,15).every(q=>q.difficulty==="sedang")&&selected.slice(15).every(q=>q.difficulty==="menantang");
      }catch(_){chapters=false}
    }
    try{
      const selected=takeQuestions(examBanks.get(s.id),{mudah:10,sedang:12,menantang:8});
      exams&&=selected.length===30&&selected.slice(0,10).every(q=>q.difficulty==="mudah")&&selected.slice(10,22).every(q=>q.difficulty==="sedang")&&selected.slice(22).every(q=>q.difficulty==="menantang");
    }catch(_){exams=false}
    shuffleKeys&&=examBanks.get(s.id).every(q=>shuffle(q.options).includes(q.answer));
  }
  checks.push(["Komposisi dan ID unik sesi bab",chapters]);
  checks.push(["Komposisi dan ID unik ujian",exams]);
  checks.push(["Kunci tetap ada setelah pilihan diacak",shuffleKeys]);
  checks.push(["Latihan ulang soal salah tersedia",typeof retryWrong==="function"]);
  checks.push(["Tautan toko HTTPS dan berbeda",new Set(["https://shopee.co.id/shop/169048647","https://lynk.id/rikearinda"]).size===2]);
  return checks;
}
function displayDiagnostics(){
  const checks=runtimeChecks();
  const chapterCount=[...chapterBanks.values()].reduce((sum,bank)=>sum+bank.length,0);
  const examCount=[...examBanks.values()].reduce((sum,bank)=>sum+bank.length,0);
  document.getElementById("diagnostic-content").innerHTML=`
    <p>Materi adalah rancangan dasar semester 1; urutan dan cakupan dapat berbeda menurut buku ajar atau ATP sekolah.</p>
    <p class="mt-2"><strong>Jumlah sebenarnya:</strong> ${chapterCount} rumusan soal bab (${chapterCount/18} per bab) dan ${examCount} soal dalam bank ujian (${examCount/3} per mata pelajaran). Tiap bab berisi delapan fakta yang masing-masing disajikan dalam tiga redaksi; sebagian soal dalam satu sesi dapat menguji konsep yang sama. Target 80 konsep berbeda per bab belum terpenuhi.</p>
    <p class="mt-2"><strong>Validasi bank:</strong> ${validation.total} ID soal diperiksa; ${validation.problems.length} masalah terdeteksi.</p>
    ${validation.problems.length?`<ul class="list-disc pl-5">${validation.problems.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
    <p class="mt-2"><strong>Pemeriksaan runtime:</strong></p>
    <ul class="list-disc pl-5">${checks.map(([name,ok])=>`<li>${ok?"✓":"✗"} ${esc(name)}</li>`).join("")}</ul>
    <p class="mt-2">Pemeriksaan otomatis ini tidak menggantikan pengujian manual isi soal dan tampilan pada semua perangkat.</p>`;
}
document.addEventListener("click",event=>{
  const target=event.target.closest("[data-action]");if(!target)return;
  const id=target.dataset.subject,ci=Number(target.dataset.chapter);
  switch(target.dataset.action){
    case"home":home();break;
    case"subject":showSubject(id);break;
    case"chapter":showChapter(id,ci);break;
    case"exam-intro":showExamIntro(id);break;
    case"start-chapter":startGame(id,ci,false);break;
    case"start-exam":startGame(id,0,true);break;
    case"answer":answer(Number(target.dataset.choice));break;
    case"next":nextQuestion();break;
    case"retry":retryWrong();break;
    case"new-game":if(mainResult)startGame(mainResult.subject,mainResult.chapter,mainResult.exam);break;
    case"back-from-game":backFromGame();break;
  }
});
document.getElementById("home-button").addEventListener("click",home);
displayDiagnostics();
home();
</script>
 
</body></html>
